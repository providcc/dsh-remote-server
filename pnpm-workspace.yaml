# pnpm 11 把设置搬到了 pnpm-workspace.yaml（写在 package.json 的 `pnpm` 字段已不再被读取）。
# 本仓不是 monorepo，这个文件只用来承载设置。
packages:
  - '.'

# 允许执行安装脚本的依赖必须显式放行：esbuild 的安装脚本要落下平台二进制，
# 而打包单文件产物那一步就要用它。
allowBuilds:
  esbuild: true

# pnpm 11 默认有 minimumReleaseAge（新发布的包要等一段时间才允许装），而 `dsh-remote-wire`
# 是本家协议包、发布后立刻要被两个消费仓装上，所以按**精确版本**放行。
# 协议升版时如果又撞上这个闸门，pnpm 会自己往这里加一条新版本；别改成通配——
# 通配等于对整个生态的新发布关掉这道供应链防线。
minimumReleaseAgeExclude:
  - dsh-remote-wire

onlyBuiltDependencies:
  - esbuild
