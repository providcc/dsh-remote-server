name: Release

# 打一个 `v*` 标签即发布：先跑一遍完整校验（与 CI 同款，标签也可能打在坏提交上），
# 然后**两条分发路一起出**：
#
# 1. npm：`npm i -g dsh-remote-server` 得到 `drc-relay` 这个命令。走 OIDC / Trusted
#    Publishing（`id-token: write`，**不设 NPM_TOKEN**），所以包带 provenance attestation。
# 2. GitHub Release：单文件产物 + SHA-256 清单。这条留着不是因为 npm 不好，而是
#    生产部署就是"scp 一个文件 + systemctl restart"：让自托管的人先 clone 再
#    `pnpm install && pnpm build` 等于把"少一层依赖树"这个卖点还回去；而带校验和是因为
#    一个只靠 curl 分发的可执行文件，总得有个办法证明"下到的就是你建的那个"。
#
# 两条路的产物是**同一个文件**：`dist/bundle/main.js`（ws/zod/协议都内联了，运行时依赖为空），
# npm 的 `bin` 与 Release 挂的 `dsh-remote-relay.mjs` 都是它，所以不存在"装出来两个版本"。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成 release notes 需要完整历史

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # lockfile 已提交（协议包 `dsh-remote-wire@1.0.0` 上了 npm 之后生成的），所以冻结安装。
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check, format check, build, tests
        run: |
          pnpm typecheck
          pnpm format:check
          pnpm test

      - name: Verify the tag matches package.json version
        env:
          # 通过 env 传事件字段，避免把可被影响的值直接插进脚本。
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          tag="${TAG_NAME#v}"
          pkg="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$tag" != "$pkg" ]; then
            echo "标签 v$tag ≠ package.json 里的版本 $pkg"
            exit 1
          fi
          echo "版本一致：$pkg"

      # 产物在空目录里"拷一个文件就能跑"是这条 release 的全部意义，所以先断言它在。
      - name: Stage the single-file artifact
        run: |
          set -e
          pnpm build
          test -s dist/bundle/main.js || { echo "缺产物 dist/bundle/main.js"; exit 1; }
          cp dist/bundle/main.js dsh-remote-relay.mjs
          sha256sum dsh-remote-relay.mjs > SHA256SUMS
          ls -l dsh-remote-relay.mjs
          cat SHA256SUMS

      # 与 control 仓同一条纪律：**不设 NODE_AUTH_TOKEN**。pnpm 手上有 token 时会先试 OIDC，
      # 换票失败就静默回落成 token 发布——表现是"版本发出去了、工作流也是绿的、
      # attestation 一个没有"，日志里只留一行 `Skipped OIDC: … 404`（wire v1.1.0 就这样）。
      # 没有 token 之后 OIDC 是唯一路径：Trusted Publishing 没配好就直接红，红得看得见。
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks

      # 发完必须独立验一次 provenance：工作流绿不等于带 attestation（见上面那条回落）。
      # 注册表侧落地有秒级延迟，所以重试到 60s，超时就红。
      - name: Verify provenance landed
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          version="${TAG_NAME#v}"
          url="https://registry.npmjs.org/-/npm/v1/attestations/dsh-remote-server@${version}"
          for i in $(seq 1 20); do
            body="$(curl -s "$url" || true)"
            if printf '%s' "$body" | grep -q '"attestations"'; then
              echo "provenance 已挂上：dsh-remote-server@${version}"
              exit 0
            fi
            sleep 3
          done
          echo "发布后 60s 仍查不到 dsh-remote-server@${version} 的 attestation。" >&2
          echo "多半是这个包还没配 Trusted Publishing（或配的 workflow 文件名不是 release.yml）。" >&2
          echo "配法：npm trust github dsh-remote-server --repo providcc/dsh-remote-server --file release.yml --allow-publish" >&2
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag \
            dsh-remote-relay.mjs SHA256SUMS
